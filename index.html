<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<title>Laporan Portofolio Saham</title>
<style>
:root{--bg:#f4f2ee;--card:#fff;--ink:#1a1a1a;--mute:#5c5c5c;--line:#e2dfd8;--acc:#1d4f7a;--naik:#17703f;--turun:#b02a24;--bintang:#d99a00;--kuning:#f2b705;--hijau:#2e9a55;--merah:#d23b32}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
.draf{background:#fff3cd;color:#664d03;padding:10px 16px;font-size:16px;text-align:center}
header{padding:8px 4px 16px}
h1{font-size:22px;margin:0;line-height:1.3}
.tgl{color:var(--mute);font-size:16px;margin-top:2px}
.kartu{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
h2{font-size:20px;margin:0 0 12px}
.besar{font-size:34px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.lbl{color:var(--mute);font-size:16px}
.ubah{font-size:22px;font-weight:600;margin-top:6px}
.naik{color:var(--naik)}.turun{color:var(--turun)}
.banding{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:17px}
.dua{display:flex;gap:12px;margin-top:12px}
.dua>div{flex:1;background:var(--bg);border-radius:10px;padding:10px 12px}
.dua .v{font-size:20px;font-weight:600}
p{margin:0 0 10px}p:last-child{margin-bottom:0}
.saham{border-top:1px solid var(--line);padding:14px 0}
.saham:first-of-type{border-top:0;padding-top:0}
.atas{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.nama{font-weight:700;font-size:19px;line-height:1.3}
.kode{color:var(--mute);font-size:15px}
.nilai{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.nilai .n{font-weight:600}
.nilai .u{font-size:16px}
.alasan{font-size:17px;margin:8px 0}
.rapor{background:var(--bg);border-radius:10px;padding:8px 12px;font-size:16px}
.rapor div{display:flex;justify-content:space-between;gap:8px}
.bt{color:var(--bintang);letter-spacing:1px;white-space:nowrap}
.bt i{color:#cfcac0;font-style:normal}
.lemah{color:var(--mute)}
.kas{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px;font-weight:600}
.titik{display:flex;gap:12px;margin-bottom:12px;align-items:flex-start}
.titik:last-child{margin-bottom:0}
.lampu{width:18px;height:18px;border-radius:50%;flex:none;margin-top:5px}
.l-hijau{background:var(--hijau)}.l-kuning{background:var(--kuning)}.l-merah{background:var(--merah)}
ol{margin:0;padding-left:22px}ol li{margin-bottom:8px}
svg text{font-size:14px;fill:var(--mute)}
.leg{display:flex;gap:18px;font-size:16px;color:var(--mute);margin-top:6px}
.leg i{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
.ket{font-size:15px;color:var(--mute);margin-top:8px}
.catatan{font-size:15px;color:var(--mute);padding:4px 6px}
.catatan p{margin-bottom:6px}
select{font:inherit;font-size:17px;width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin-top:6px}
a.rinci{display:block;text-align:center;font-size:15px;color:var(--acc);margin-top:18px}
</style>
</head>
<body>
<div class="draf" id="draf" hidden>Pratinjau, belum dikirim ke pemilik dana</div>
<div class="wrap" id="isi"><p>Memuat laporan...</p></div>
<script>
(function(){
const draft=new URLSearchParams(location.search).has('draft');
const SRC=draft?['data/ringkas-draft.json','data/draft.json']:['data/ringkas.json','data/paket.json'];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function rp(v){const a=Math.abs(v);let t;
  if(a>=1e9)t=(a/1e9).toLocaleString('id-ID',{maximumFractionDigits:2})+' miliar';
  else if(a>=1e6)t=(a/1e6).toLocaleString('id-ID',{maximumFractionDigits:2})+' juta';
  else if(a>=1e3)t=Math.round(a/1e3).toLocaleString('id-ID')+' ribu';
  else t=Math.round(a).toLocaleString('id-ID');
  return 'Rp'+t;}
const pct=v=>(Math.abs(v)*100).toLocaleString('id-ID',{maximumFractionDigits:1})+'%';
const arah=v=>v>=0?'naik':'turun';
const tgl=s=>new Date(s+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
const bintang=n=>'<span class="bt">'+'★'.repeat(n)+'<i>'+'★'.repeat(5-n)+'</i></span>';
let R,P,W;
function grafik(w){
  const t0=(P.kebijakan||[]).find(k=>k.kode==='titik_awal_tanggal')?.nilai_teks||'';
  const pts=(P.nilai_harian||[]).filter(p=>p.tanggal>=t0&&p.tanggal<=w.tanggal_akhir);
  if(pts.length<2)return '';
  const A=pts.map(p=>p.nilai_total/pts[0].nilai_total*100),B=pts.map(p=>p.ihsg/pts[0].ihsg*100);
  const all=A.concat(B),mn=Math.floor(Math.min(...all)-1),mx=Math.ceil(Math.max(...all)+1);
  const W_=340,H=200,pl=34,pr=8,pt=8,pb=26,x=i=>pl+i*(W_-pl-pr)/(pts.length-1),y=v=>pt+(mx-v)*(H-pt-pb)/(mx-mn);
  const ln=(a,c)=>`<polyline fill="none" stroke="${c}" stroke-width="3" stroke-linejoin="round" points="${a.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ')}"/>`;
  let g=`<line x1="${pl}" x2="${W_-pr}" y1="${y(100)}" y2="${y(100)}" stroke="#bbb" stroke-dasharray="4 4"/><text x="${pl-4}" y="${y(100)+5}" text-anchor="end">100</text>`;
  const d=s=>{const q=new Date(s+'T00:00:00');return q.getDate()+'/'+(q.getMonth()+1)};
  g+=`<text x="${pl}" y="${H-6}">${d(pts[0].tanggal)}</text><text x="${W_-pr}" y="${H-6}" text-anchor="end">${d(pts[pts.length-1].tanggal)}</text>`;
  const a=A[A.length-1]-100,b=B[B.length-1]-100;
  return `<div class="kartu"><h2>Perjalanan sejak awal</h2><svg viewBox="0 0 ${W_} ${H}" width="100%" role="img" aria-label="Grafik portofolio dibanding pasar">${g}${ln(B,'#9a958c')}${ln(A,'#1d4f7a')}</svg>
  <div class="leg"><span><i style="background:#1d4f7a"></i>Portofolio ${a>=0?'+':'−'}${pct(a/100)}</span><span><i style="background:#9a958c"></i>Pasar ${b>=0?'+':'−'}${pct(b/100)}</span></div>
  <div class="ket">Dihitung sejak ${tgl(t0)}, saat cara pengelolaan baru dimulai. Garis putus-putus adalah titik awal.</div>${w.pasar?`<p style="margin-top:10px">${esc(w.pasar)}</p>`:''}</div>`;
}
function render(){
  const w=R.minggu.find(m=>m.minggu===W);
  const ch=w.nilai_akhir-w.nilai_awal,cp=ch/w.nilai_awal;
  const sa=w.nilai_akhir/w.nilai_titik_awal-1;
  let h=`<header><h1>Laporan Portofolio Saham</h1><div class="tgl">${esc(w.label)}</div></header>`;
  h+=`<div class="kartu"><div class="lbl">Nilai portofolio sekarang</div><div class="besar">${rp(w.nilai_akhir)}</div>
  <div class="ubah ${arah(ch)}">${ch>=0?'Naik':'Turun'} ${rp(ch)} (${pct(cp)}) minggu ini</div>
  <div class="banding">Pasar saham secara umum ${arah(w.ihsg_pct)} ${pct(w.ihsg_pct)}. ${Math.abs(cp-w.ihsg_pct)<0.0025?'Hasil portofolio hampir sama dengan pasar.':cp>w.ihsg_pct?'Portofolio lebih baik dari pasar.':'Portofolio sedikit di bawah pasar.'}</div>
  <div class="dua"><div><div class="lbl">Sejak awal</div><div class="v ${arah(sa)}">${sa>=0?'+':'−'}${pct(sa)}</div></div><div><div class="lbl">Uang tunai</div><div class="v">${rp(w.kas)}</div></div></div></div>`;
  h+=`<div class="kartu"><h2>Ringkasan minggu ini</h2>${w.kesimpulan.map(k=>`<p>${esc(k)}</p>`).join('')}</div>`;
  h+=`<div class="kartu"><h2>Saham yang dipegang</h2>`;
  for(const s of w.saham){
    h+=`<div class="saham"><div class="atas"><div><div class="nama">${esc(s.nama)}</div><div class="kode">${esc(s.kode)} · ${esc(s.usaha)}</div></div>
    <div class="nilai"><div class="n">${rp(s.nilai)}</div><div class="u ${arah(s.untung)}">${s.untung>=0?'Untung':'Rugi'} ${rp(s.untung)}</div></div></div>
    <div class="alasan">${esc(s.alasan)}</div>`;
    if(s.rapor){h+=`<div class="rapor">${s.rapor.kuat.map(r=>`<div><span>${esc(r.faktor)}</span>${bintang(r.bintang)}</div>`).join('')}${s.rapor.lemah&&s.rapor.lemah.bintang<=2?`<div class="lemah"><span>${esc(s.rapor.lemah.teks)}</span>${bintang(s.rapor.lemah.bintang)}</div>`:''}</div>`}
    h+=`</div>`;
  }
  h+=`<div class="kas"><span>Uang tunai</span><span>${rp(w.kas)}</span></div><div class="ket">Bintang menunjukkan posisi saham dibanding saham besar lain yang lolos seleksi. Lima bintang berarti termasuk yang terbaik.</div></div>`;
  h+=grafik(w);
  if(w.perhatian&&w.perhatian.length){h+=`<div class="kartu"><h2>Yang perlu diperhatikan</h2>${w.perhatian.map(p=>`<div class="titik"><span class="lampu l-${esc(p.lampu)}" aria-label="${esc(p.lampu)}"></span><div>${esc(p.teks)}</div></div>`).join('')}<div class="ket">Hijau aman, kuning dipantau, merah perlu tindakan.</div></div>`}
  h+=`<div class="kartu"><h2>Rencana minggu depan</h2>${w.rencana&&w.rencana.length?`<ol>${w.rencana.map(r=>`<li>${esc(r)}</li>`).join('')}</ol>`:'<p>Tidak ada jual beli minggu depan.</p>'}</div>`;
  h+=`<div class="catatan"><p>Keputusan jual beli mengikuti aturan tertulis yang sama setiap minggu, bukan tebakan harian.</p><p>Hasil yang sudah lewat tidak menjamin hasil ke depan.</p><p>Angka diambil dari rekening saham dan dicek ulang setiap minggu. Laporan disusun ${tgl(w.tanggal_laporan)}.</p></div>`;
  if(R.minggu.length>1){h+=`<div class="kartu" style="margin-top:14px"><div class="lbl">Lihat laporan minggu lain</div><select id="pilih">${R.minggu.slice().reverse().map(m=>`<option value="${m.minggu}"${m.minggu===W?' selected':''}>${esc(m.label)}</option>`).join('')}</select></div>`}
  h+=`<a class="rinci" href="rinci.html${draft?'?draft':''}">Lihat rincian lengkap</a>`;
  document.getElementById('isi').innerHTML=h;
  const s=document.getElementById('pilih');if(s)s.onchange=e=>{W=e.target.value;render();scrollTo(0,0)};
}
Promise.all(SRC.map(u=>fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}))).then(([r,p])=>{
  R=r;P=p;W=R.minggu[R.minggu.length-1].minggu;document.getElementById('draf').hidden=!draft;render();
}).catch(e=>{document.getElementById('isi').innerHTML='<p>Laporan belum tersedia.</p>'});
})();
</script>
</body>
</html>
